[package]
name = "sortcore"
version = "0.1.0"
edition = "2021"
description = "Sort Pedia sorting algorithms (instrumented) compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
